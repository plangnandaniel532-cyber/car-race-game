<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATEAU RACE PRO</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial;text-align:center;overflow:hidden}
canvas{background:#222;border:4px solid #00ff88;border-radius:10px}
#hud{display:flex;justify-content:space-around;font-weight:bold;padding:8px;background:#1a1a1a}
.btn{width:85px;height:85px;background:#222;border:3px solid #00ff88;border-radius:50%;color:#00ff88;font-size:30px;margin:8px}
#gameOver{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:10}
#gameOver h1{color:#ff3333;font-size:40px;margin:5px}
.card{background:#1a1a1a;padding:25px;border-radius:15px;border:2px solid #00ff88;width:80%;max-width:320px}
.payBtn{background:#00ff88;color:#000;padding:14px;width:100%;border:none;border-radius:25px;font-weight:bold;font-size:16px;margin:6px 0}
.freeBtn{background:transparent;color:white;border:2px solid white;padding:12px;width:100%;border-radius:25px;margin:6px 0}
.support{background:#25D366;color:white;padding:10px 18px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:10px;font-size:14px}
</style></head><body>
<h2>🏎️ PLATEAU RACE</h2>
<div id="hud"><span id="sc">Score: 0</span><span id="hs">Best: 0</span><span id="sp">0 km/h</span></div>
<canvas id="c" width="380" height="500"></canvas><br>
<button class="btn" id="lb">◀</button><button class="btn" id="rb">▶</button><br>
<a class="support" href="https://wa.me/2349066536496?text=I%20want%20to%20hire%20you!" target="_blank">Support / Hire Me</a>

<div id="gameOver">
  <div class="card">
    <h1>💥 CRASH!</h1>
    <p id="finalScore" style="font-size:22px;font-weight:bold">Score: 0</p>
    <p id="bestScore" style="color:#00ff88">Best: 0</p>
    <button class="payBtn" onclick="payContinue()">🔥 CONTINUE - Pay ₦100</button>
    <button class="freeBtn" onclick="startOver()">🔄 Start Over (Free)</button>
    <button class="freeBtn" style="border-color:#00ff88;color:#00ff88" onclick="newGame()">🆕 New Game</button>
    <p style="font-size:11px;color:#888;margin-top:10px">Pay to continue with same score!</p>
  </div>
</div>

<script>
C=document.getElementById('c');X=C.getContext('2d');px=165;py=420;en=[];sc=0;sp=4;L=false;R=false;best=localStorage.getItem('best')||0;isOver=false;
document.getElementById('hs').innerText='Best: '+best;
function drawCar(x,y,c){X.fillStyle=c;X.fillRect(x+5,y,40,70);X.fillStyle='#111';X.fillRect(x+8,y+10,34,15);X.fillStyle='yellow';X.fillRect(x+8,y+65,8,5);X.fillRect(x+34,y+65,8,5)}
function loop(){
 if(isOver)return;
 X.clearRect(0,0,380,500);X.fillStyle='#2a2a2a';X.fillRect(0,0,380,500);
 X.fillStyle='white';for(let i=0;i<500;i+=50){X.fillRect(185,i+Date.now()/10%50,10,25)}
 if(L&&px>20)px-=6;if(R&&px<310)px+=6;
 if(Math.random()<0.025)en.push({x:20+Math.random()*300,y:-80});
 en.forEach((o,i)=>{o.y+=sp;if(o.y>550){en.splice(i,1);sc+=5;sp+=0.04}});
 for(let o of en){if(o.x<px+50&&o.x+40>px&&o.y<py+70&&o.y+70>py){gameOver()}}
 drawCar(px,py,'#00ff88');en.forEach(o=>drawCar(o.x,o.y,'#ff3333'));
 document.getElementById('sc').innerText='Score: '+sc;document.getElementById('sp').innerText=Math.floor(sp*15)+' km/h';
 requestAnimationFrame(loop);
}loop();
function gameOver(){
 isOver=true;
 if(sc>best){best=sc;localStorage.setItem('best',best)}
 document.getElementById('finalScore').innerText='Score: '+sc;
 document.getElementById('bestScore').innerText='Best: '+best;
 document.getElementById('gameOver').style.display='flex';
}
function startOver(){document.getElementById('gameOver').style.display='none';en=[];sc=0;sp=4;px=165;isOver=false;loop()}
function newGame(){en=[];sc=0;sp=4;px=165;isOver=false;document.getElementById('gameOver').style.display='none';loop()}
function payContinue(){
 // REPLACE THIS WITH YOUR PAYSTACK LINK
 let payLink = "https://paystack.com/pay/YOUR_PAY_LINK"; 
 if(confirm("You will pay ₦100 to continue with Score "+sc+"? Click OK to pay.")){
   window.open(payLink, "_blank");
   // After payment, give them continue (for test, we continue immediately)
   setTimeout(()=>{
     document.getElementById('gameOver').style.display='none';
     en=[];isOver=false;loop();
   }, 1000);
 }
}
function bind(b,f){b.ontouchstart=e=>{e.preventDefault();f?L=true:R=true};b.ontouchend=e=>{e.preventDefault();f?L=false:R=false};b.onmousedown=()=>f?L=true:R=true;b.onmouseup=()=>f?L=false:R=false}
bind(lb,true);bind(rb,false);
</script></body></html>
