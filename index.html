<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATEAU RACE</title>
<style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:sans-serif}canvas{background:#333;border:3px solid blue}</style>
</head><body>
<h2>🏎️ PLATEAU RACE</h2>
<p id="s">Score: 0</p>
<canvas id="c" width="360" height="500"></canvas><br>
<button style="width:80px;height:60px" onmousedown="L=true" onmouseup="L=false" ontouchstart="L=true" ontouchend="L=false">◀</button>
<button style="width:80px;height:60px" onmousedown="R=true" onmouseup="R=false" ontouchstart="R=true" ontouchend="R=false">▶</button>
<script>
C=document.getElementById('c');X=C.getContext('2d');px=150;py=400;en=[];sc=0;sp=3;L=false;R=false;
function loop(){
 X.clearRect(0,0,360,500);X.fillStyle='#444';X.fillRect(0,0,360,500);
 if(L&&px>0)px-=5;if(R&&px<310)px+=5;
 if(Math.random()<0.03)en.push({x:Math.random()*310,y:-50});
 en.forEach((o,i)=>{o.y+=sp;if(o.y>500){en.splice(i,1);sc++;sp+=0.02} if(o.x<px+50&&o.x+50>px&&o.y<py+80&&o.y+80>py){alert('Game Over! Score '+sc);location.reload()}});
 X.fillStyle='lime';X.fillRect(px,py,50,80);
 X.fillStyle='red';en.forEach(o=>X.fillRect(o.x,o.y,50,80));
 document.getElementById('s').innerText='Score: '+sc;requestAnimationFrame(loop);
}loop();
</script></body></html>
